      - name: Fix Package.swift iOS compatibility
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)
          cd "$ROOT"

          echo "========================================"
          echo "Fixing Package.swift platform versions"
          echo "========================================"

          FOUND=0

          while IFS= read -r -d '' file; do

            if grep -q '\.iOS(\.v26)' "$file"; then
              echo "Fixing iOS v26 -> v16:"
              echo "$file"

              sed -i '' 's/\.iOS(\.v26)/.iOS(.v16)/g' "$file"

              FOUND=1
            fi

            if grep -q '\.iOS(\.v18)' "$file"; then
              echo "Fixing iOS v18 -> v16:"
              echo "$file"

              sed -i '' 's/\.iOS(\.v18)/.iOS(.v16)/g' "$file"

              FOUND=1
            fi

          done < <(
            find Packages \
              -name "Package.swift" \
              -print0
          )

          echo ""

          if [ "$FOUND" -eq 0 ]; then
            echo "No v26/v18 iOS package declarations found."
          else
            echo "Package platform compatibility fixed."
          fi

          echo ""
          echo "Remaining iOS platform declarations:"
          grep -RIn \
            --include="Package.swift" \
            '\.iOS(' \
            Packages 2>/dev/null || true

          echo ""
          echo "Remaining v26 references:"
          grep -RIn \
            --include="Package.swift" \
            '\.v26' \
            Packages 2>/dev/null || true

          echo ""
          echo "Remaining v18 references:"
          grep -RIn \
            --include="Package.swift" \
            '\.v18' \
            Packages 2>/dev/null || true
