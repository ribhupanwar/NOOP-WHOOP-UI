name: Build NOOP WHOOP iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:

      # --------------------------------------------------
      # 0. Select compatible Xcode
      # --------------------------------------------------
      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show Xcode version
        shell: bash
        run: |
          set -e

          echo "Xcode version:"
          xcodebuild -version

          echo ""
          echo "Developer directory:"
          xcode-select -p

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Download official NOOP project configuration
      # --------------------------------------------------
      - name: Download official NOOP project.yml
        shell: bash
        run: |
          set -e

          curl -L \
            https://raw.githubusercontent.com/ryanbr/noop/main/project.yml \
            -o official-project.yml

          echo "Official project.yml downloaded"
          wc -l official-project.yml

      # --------------------------------------------------
      # 3. Extract customized source
      # --------------------------------------------------
      - name: Extract customized source
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Source ZIP not found"
            exit 1
          fi

          echo "Using source:"
          echo "$ZIP"

          rm -rf noop-source
          mkdir -p noop-source

          unzip -q "$ZIP" -d noop-source

          echo ""
          echo "Extracted directories:"
          find noop-source -maxdepth 3 -type d | head -100

      # --------------------------------------------------
      # 4. Locate actual NOOP source directory
      # --------------------------------------------------
      - name: Locate NOOP source
        shell: bash
        run: |
          set -e

          ROOT=$(find noop-source -type d -name "StrandiOS" | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "::error::StrandiOS folder not found"
            exit 1
          fi

          ROOT=$(dirname "$ROOT")

          echo "NOOP source root:"
          echo "$ROOT"

          echo "$ROOT" > source-root.txt

      # --------------------------------------------------
      # 5. Install official project.yml
      # --------------------------------------------------
      - name: Install official project.yml
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cp official-project.yml "$ROOT/project.yml"

          echo "Installed official project.yml:"
          ls -lh "$ROOT/project.yml"

      # --------------------------------------------------
      # 6. Install XcodeGen
      # --------------------------------------------------
      - name: Install XcodeGen
        shell: bash
        run: |
          set -e

          brew install xcodegen

          echo ""
          echo "XcodeGen version:"
          xcodegen --version

      # --------------------------------------------------
      # 7. Generate Strand.xcodeproj
      # --------------------------------------------------
      - name: Generate Xcode project
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          rm -rf Strand.xcodeproj

          xcodegen generate

          echo ""
          echo "Generated project:"
          find Strand.xcodeproj -maxdepth 2 -print

          if [ ! -f "Strand.xcodeproj/project.pbxproj" ]; then
            echo "::error::XcodeGen did not create project.pbxproj"
            exit 1
          fi

          echo ""
          echo "project.pbxproj successfully generated."

      # --------------------------------------------------
      # 8. Check generated Xcode project
      # --------------------------------------------------
      - name: Check Xcode project
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          echo "Checking Xcode project..."

          xcodebuild \
            -project Strand.xcodeproj \
            -list

      # --------------------------------------------------
      # 9. Build unsigned iOS app
      # --------------------------------------------------
      - name: Build NOOPiOS
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          rm -rf build

          echo "Starting unsigned iOS build..."

          xcodebuild \
            -project Strand.xcodeproj \
            -scheme NOOPiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      # --------------------------------------------------
      # 10. Locate built iOS app
      # --------------------------------------------------
      - name: Locate built iOS app
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          echo "Searching for iOS app..."

          find build \
            -type d \
            \( -name "*.app" -o -name "*.appex" \) \
            -print

          APP=$(find build \
            -type d \
            -path "*/Build/Products/*-iphoneos/*.app" \
            -not -path "*/PlugIns/*" \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "::error::iOS .app not found"
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo ""
          echo "Selected app:"
          echo "$APP"

      # --------------------------------------------------
      # 11. Create unsigned IPA
      # --------------------------------------------------
      - name: Create IPA
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          echo ""
          echo "IPA contents:"
          find Payload -maxdepth 3 -type d | head -100

          mkdir -p artifacts

          zip -qry \
            artifacts/NOOP-WHOOP-Custom-iOS-Unsigned.ipa \
            Payload

          echo ""
          echo "IPA created:"
          ls -lh artifacts/NOOP-WHOOP-Custom-iOS-Unsigned.ipa

      # --------------------------------------------------
      # 12. Upload IPA
      # --------------------------------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-WHOOP-Custom-iOS-Unsigned-IPA
          path: noop-source/**/artifacts/NOOP-WHOOP-Custom-iOS-Unsigned.ipa
          if-no-files-found: error

      # --------------------------------------------------
      # 13. Upload generated Xcode project
      # --------------------------------------------------
      - name: Upload generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-Generated-Xcode-Project
          path: noop-source/**/Strand.xcodeproj
          if-no-files-found: error
