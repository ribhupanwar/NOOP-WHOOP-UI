name: Build NOOP WHOOP iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:

      # ---------------------------------------------------------
      # 1. Select Xcode
      # ---------------------------------------------------------
      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show Xcode version
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Xcode version"
          echo "========================================"
          xcodebuild -version

          echo ""
          echo "Developer directory:"
          xcode-select -p

          echo ""
          echo "Swift version:"
          swift --version


      # ---------------------------------------------------------
      # 2. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 3. Download official NOOP project.yml
      # ---------------------------------------------------------
      - name: Download official NOOP project.yml
        shell: bash
        run: |
          set -e

          curl -L \
            https://raw.githubusercontent.com/ryanbr/noop/main/project.yml \
            -o official-project.yml

          echo "Official project.yml downloaded:"
          ls -lh official-project.yml

          echo ""
          echo "Lines:"
          wc -l official-project.yml


      # ---------------------------------------------------------
      # 4. Find source ZIP
      # ---------------------------------------------------------
      - name: Extract customized source
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Source ZIP not found in repository root."
            exit 1
          fi

          echo "Using source ZIP:"
          echo "$ZIP"

          rm -rf noop-source
          mkdir -p noop-source

          unzip -q "$ZIP" -d noop-source

          echo ""
          echo "Extracted directories:"
          find noop-source -maxdepth 3 -type d | head -100


      # ---------------------------------------------------------
      # 5. Locate NOOP source root
      # ---------------------------------------------------------
      - name: Locate NOOP source
        shell: bash
        run: |
          set -e

          ROOT=$(find noop-source -type d -name "StrandiOS" | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "::error::StrandiOS folder not found."
            exit 1
          fi

          ROOT=$(dirname "$ROOT")

          echo "========================================"
          echo "NOOP source root:"
          echo "$ROOT"
          echo "========================================"

          echo "$ROOT" > source-root.txt


      # ---------------------------------------------------------
      # 6. Install official project.yml
      # ---------------------------------------------------------
      - name: Install official project.yml
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cp official-project.yml "$ROOT/project.yml"

          echo "Installed official project.yml:"
          ls -lh "$ROOT/project.yml"


      # ---------------------------------------------------------
      # 7. Fix iOS 26 Package.swift declarations
      #
      # Xcode 16.4 understands up to iOS 18 SDK.
      # .iOS(.v26) causes:
      # "reference to member 'v26' cannot be resolved"
      # ---------------------------------------------------------
      - name: Fix Package.swift iOS 26 compatibility
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)
          cd "$ROOT"

          echo "========================================"
          echo "Searching Package.swift files for .iOS(.v26)"
          echo "========================================"

          FOUND=0

          while IFS= read -r -d '' file; do
            if grep -q '\.iOS(\.v26)' "$file"; then
              echo "Fixing: $file"

              sed -i '' 's/\.iOS(\.v26)/.iOS(.v18)/g' "$file"

              FOUND=1
            fi
          done < <(
            find Packages \
              -name "Package.swift" \
              -print0
          )

          echo ""

          if [ "$FOUND" -eq 0 ]; then
            echo "No .iOS(.v26) references found."
          else
            echo "All .iOS(.v26) references changed to .iOS(.v18)."
          fi

          echo ""
          echo "Remaining .v26 references:"
          grep -RIn \
            --include="Package.swift" \
            '\.v26' \
            Packages 2>/dev/null || true


      # ---------------------------------------------------------
      # 8. Remove unsupported Liquid Glass APIs
      #
      # Xcode 16.4 / iOS 18.5 SDK does not expose:
      # - glassEffect
      # - GlassEffect
      # - ButtonStyle.glass
      #
      # Replace NoopLiquidGlassSearchField.swift with a
      # compile-safe fallback implementation.
      # ---------------------------------------------------------
      - name: Fix Liquid Glass source compatibility
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          FILE="$ROOT/Packages/StrandDesign/Sources/StrandDesign/NoopLiquidGlassSearchField.swift"

          if [ ! -f "$FILE" ]; then
            echo "::error::NoopLiquidGlassSearchField.swift not found."
            exit 1
          fi

          echo "Replacing:"
          echo "$FILE"

          cat > "$FILE" <<'SWIFT'
          import SwiftUI

          // MARK: - Compatible Liquid Glass Search Field
          //
          // Xcode 16.4 / iOS 18-compatible implementation.
          //
          // The original source used iOS 26-only APIs such as:
          //     glassEffect(...)
          //     ButtonStyle.glass
          //
          // Those APIs are not available in the Xcode 16.4 SDK.
          // This implementation keeps the same UI structure, accessibility,
          // focus handling and search behavior while using the existing
          // standard NOOP surface.

          public struct NoopLiquidGlassSearchField: View {
              @Binding private var text: String

              private let prompt: String
              private let accessibilityPrompt: String

              private var externalFocus: FocusState<Bool>.Binding?

              @FocusState private var internalFocus: Bool

              public init(
                  text: Binding<String>,
                  prompt: String,
                  accessibilityLabel: String? = nil,
                  isFocused: FocusState<Bool>.Binding? = nil
              ) {
                  self._text = text
                  self.prompt = prompt
                  self.accessibilityPrompt = accessibilityLabel ?? prompt
                  self.externalFocus = isFocused
              }

              public var body: some View {
                  HStack(spacing: NoopMetrics.space2) {

                      Image(systemName: "magnifyingglass")
                          .font(.system(size: 16, weight: .semibold))
                          .foregroundStyle(StrandPalette.textSecondary)
                          .accessibilityHidden(true)

                      TextField(
                          prompt,
                          text: $text
                      )
                      .textFieldStyle(.plain)
                      .font(StrandFont.body)
                      .foregroundStyle(StrandPalette.textPrimary)
                      .focused(focusBinding)
                      .submitLabel(.search)

                      #if os(iOS)
                      .autocorrectionDisabled()
                      .textInputAutocapitalization(.never)
                      #endif

                      if !text.isEmpty {
                          Button {
                              text = ""
                          } label: {
                              Image(systemName: "xmark.circle.fill")
                                  .font(
                                      .system(
                                          size: 16,
                                          weight: .semibold
                                      )
                                  )
                                  .foregroundStyle(
                                      StrandPalette.textTertiary
                                  )
                                  .frame(
                                      width: 28,
                                      height: 28
                                  )
                                  .contentShape(Circle())
                          }
                          .buttonStyle(.plain)
                          .accessibilityLabel(
                              Text("Clear search")
                          )
                      }
                  }
                  .padding(
                      .horizontal,
                      NoopMetrics.space4
                  )
                  .padding(
                      .vertical,
                      NoopMetrics.space3
                  )
                  .nativeLiquidGlassSearchChrome()
                  .accessibilityElement(
                      children: .contain
                  )
                  .accessibilityLabel(
                      Text(accessibilityPrompt)
                  )
              }

              private var focusBinding:
                  FocusState<Bool>.Binding {
                  externalFocus ?? $internalFocus
              }
          }

          // MARK: - Compatibility View Modifiers

          public extension View {

              /// Search field surface.
              ///
              /// Uses the standard NOOP surface when building with
              /// Xcode 16.4 / iOS 18 SDK.
              @ViewBuilder
              func nativeLiquidGlassSearchChrome() -> some View {
                  self.background(
                      NoopPanelSurface(
                          cornerRadius:
                              NoopVisualStyle.pillRadius,
                          elevated: false
                      )
                  )
              }

              /// Liquid Glass button compatibility wrapper.
              ///
              /// Current CI SDK does not expose ButtonStyle.glass,
              /// so use the supplied fallback.
              @ViewBuilder
              func nativeLiquidGlassButtonChrome<
                  Fallback: View
              >(
                  controlSize: ControlSize = .small,
                  capsule: Bool = false,
                  @ViewBuilder fallback:
                      () -> Fallback
              ) -> some View {
                  fallback()
              }

              /// Liquid Glass circular finish compatibility wrapper.
              ///
              /// No-op on Xcode 16.4 / iOS 18 SDK.
              @ViewBuilder
              func nativeLiquidGlassCircleFinish() -> some View {
                  self
              }

              @ViewBuilder
              private func noopStandardSearchChrome() -> some View {
                  self.background(
                      NoopPanelSurface(
                          cornerRadius:
                              NoopVisualStyle.pillRadius,
                          elevated: false
                      )
                  )
              }
          }
          SWIFT

          echo ""
          echo "Liquid Glass compatibility source installed."

          echo ""
          echo "Checking for remaining unsupported APIs:"
          grep -RIn \
            -E 'glassEffect|\.buttonStyle\(\.glass\)' \
            "$ROOT/Packages/StrandDesign/Sources/StrandDesign" \
            2>/dev/null || true


      # ---------------------------------------------------------
      # 9. Install XcodeGen
      # ---------------------------------------------------------
      - name: Install XcodeGen
        shell: bash
        run: |
          set -e

          brew install xcodegen

          echo ""
          echo "XcodeGen version:"
          xcodegen --version


      # ---------------------------------------------------------
      # 10. Generate Xcode project
      # ---------------------------------------------------------
      - name: Generate Xcode project
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          rm -rf Strand.xcodeproj

          echo "Generating Xcode project..."

          xcodegen generate

          echo ""
          echo "Generated project:"
          find Strand.xcodeproj -maxdepth 2 -print

          if [ ! -f "Strand.xcodeproj/project.pbxproj" ]; then
            echo "::error::XcodeGen did not create project.pbxproj."
            exit 1
          fi

          echo ""
          echo "project.pbxproj successfully generated."


      # ---------------------------------------------------------
      # 11. Check project
      # ---------------------------------------------------------
      - name: Check Xcode project
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          echo "Checking Xcode project..."

          xcodebuild \
            -project Strand.xcodeproj \
            -list


      # ---------------------------------------------------------
      # 12. Resolve Swift packages
      # ---------------------------------------------------------
      - name: Resolve Swift packages
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          echo "Resolving Swift packages..."

          xcodebuild \
            -resolvePackageDependencies \
            -project Strand.xcodeproj

          echo ""
          echo "Swift package resolution completed."


      # ---------------------------------------------------------
      # 13. Build unsigned NOOP iOS
      # ---------------------------------------------------------
      - name: Build NOOPiOS
        shell: bash
        run: |
          set -o pipefail

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          rm -rf build

          echo "========================================"
          echo "Starting unsigned iOS build"
          echo "========================================"

          xcodebuild \
            -project Strand.xcodeproj \
            -scheme NOOPiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build \
            | tee build.log

          echo ""
          echo "========================================"
          echo "Build completed successfully"
          echo "========================================"


      # ---------------------------------------------------------
      # 14. Locate built iOS app
      # ---------------------------------------------------------
      - name: Locate built iOS app
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          echo "Searching for iOS .app..."

          find build \
            -type d \
            -path "*/Build/Products/*-iphoneos/*.app" \
            -not -path "*/PlugIns/*" \
            -print

          APP=$(find build \
            -type d \
            -path "*/Build/Products/*-iphoneos/*.app" \
            -not -path "*/PlugIns/*" \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "::error::iOS .app not found."
            exit 1
          fi

          echo ""
          echo "Selected app:"
          echo "$APP"

          echo "APP=$APP" >> "$GITHUB_ENV"


      # ---------------------------------------------------------
      # 15. Create unsigned IPA
      # ---------------------------------------------------------
      - name: Create IPA
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          rm -rf Payload
          mkdir -p Payload

          echo "Copying app into Payload..."

          cp -R "$APP" Payload/

          echo ""
          echo "IPA contents:"
          find Payload -maxdepth 3 -type d | head -100

          mkdir -p artifacts

          zip -qry \
            artifacts/NOOP-WHOOP-Custom-iOS-Unsigned.ipa \
            Payload

          echo ""
          echo "========================================"
          echo "IPA created:"
          echo "========================================"

          ls -lh \
            artifacts/NOOP-WHOOP-Custom-iOS-Unsigned.ipa


      # ---------------------------------------------------------
      # 16. Upload IPA
      # ---------------------------------------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-WHOOP-Custom-iOS-Unsigned-IPA
          path: noop-source/**/artifacts/NOOP-WHOOP-Custom-iOS-Unsigned.ipa
          if-no-files-found: error


      # ---------------------------------------------------------
      # 17. Upload generated Xcode project
      # ---------------------------------------------------------
      - name: Upload generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-Generated-Xcode-Project
          path: noop-source/**/Strand.xcodeproj
          if-no-files-found: error


      # ---------------------------------------------------------
      # 18. Upload build log if build fails
      # ---------------------------------------------------------
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-Build-Debug-Logs
          path: |
            noop-source/**/build.log
            noop-source/**/project.yml
          if-no-files-found: ignore
