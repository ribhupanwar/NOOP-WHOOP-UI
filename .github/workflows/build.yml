name: Build OpenStrap Edge IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Disable iOS Code Signing
        shell: bash
        run: |
          set -e

          PBX="ios/Runner.xcodeproj/project.pbxproj"

          if [ -f "$PBX" ]; then
            sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' "$PBX" || true
            sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBX" || true
            sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "[^"]*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PBX" || true
          fi

          mkdir -p ios/Flutter

          cat > ios/Flutter/Signing.defaults.xcconfig <<'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          DEVELOPMENT_TEAM =
          PROVISIONING_PROFILE_SPECIFIER =
          EOF

      - name: Build iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign

      - name: Locate Runner.app
        id: locate
        shell: bash
        run: |
          set -e

          APP=$(find build -type d -name "Runner.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "Runner.app not found"
            find build -maxdepth 5 -type d | head -200
            exit 1
          fi

          echo "APP=$APP"
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"

      - name: Check Apple Watch App
        shell: bash
        run: |
          set -e

          APP="${{ steps.locate.outputs.app_path }}"

          echo "Checking embedded Watch app..."

          if [ -d "$APP/Watch" ]; then
            find "$APP/Watch" -maxdepth 3 -type d -name "*.app" -print
          else
            echo "WARNING: No Watch directory found."
          fi

      - name: Sign Embedded Watch Components
        shell: bash
        run: |
          set -e

          APP="${{ steps.locate.outputs.app_path }}"

          if [ ! -d "$APP/Watch" ]; then
            echo "No Watch app to sign."
            exit 0
          fi

          echo "Signing embedded Watch binaries..."

          find "$APP/Watch" -type f -perm -111 | while read -r FILE; do
            if file "$FILE" | grep -q "Mach-O"; then
              echo "Signing: $FILE"
              codesign \
                --force \
                --sign - \
                --timestamp=none \
                "$FILE" || true
            fi
          done

          find "$APP/Watch" -type d -name "*.app" | while read -r WATCHAPP; do
            echo "Signing Watch app: $WATCHAPP"

            codesign \
              --force \
              --deep \
              --sign - \
              --timestamp=none \
              "$WATCHAPP" || true
          done

      - name: Sign Main App Bundle
        shell: bash
        run: |
          set -e

          APP="${{ steps.locate.outputs.app_path }}"

          codesign \
            --force \
            --deep \
            --sign - \
            --timestamp=none \
            "$APP" || true

      - name: Verify Watch Bundle
        shell: bash
        run: |
          set -e

          APP="${{ steps.locate.outputs.app_path }}"

          echo "=== Embedded Watch contents ==="
          find "$APP/Watch" -maxdepth 4 -print 2>/dev/null || true

          echo "=== Bundle identifiers ==="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist" || true

          find "$APP/Watch" -name Info.plist -print | while read -r PLIST; do
            echo "--- $PLIST"
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$PLIST" || true
          done

      - name: Create IPA
        shell: bash
        run: |
          set -e

          APP="${{ steps.locate.outputs.app_path }}"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/Runner.app

          rm -f openstrap-edge-custom-watch-unsigned.ipa

          zip -qry \
            openstrap-edge-custom-watch-unsigned.ipa \
            Payload

          echo "IPA created:"
          ls -lh openstrap-edge-custom-watch-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: openstrap-edge-custom-watch-unsigned-ipa
          path: openstrap-edge-custom-watch-unsigned.ipa
          if-no-files-found: error
