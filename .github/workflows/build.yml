name: Check NOOP Project Format

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          mkdir -p noop-source
          unzip -q "$ZIP" -d noop-source

      - name: Check Xcode project format
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "XCODE PROJECT FILES"
          echo "=========================================="

          find noop-source \
            -type f \
            \( \
              -name "project.pbxproj" \
              -o -name "*.xcproj" \
              -o -name "*.xcodeproj" \
              -o -name "*.xcworkspace" \
              -o -name "contents.xcworkspacedata" \
              -o -name "Package.resolved" \
            \) \
            -print

          echo ""
          echo "=========================================="
          echo "STRAND.XCODEPROJ CONTENT"
          echo "=========================================="

          find noop-source/noop-main/Strand.xcodeproj \
            -maxdepth 4 \
            -print

          echo ""
          echo "=========================================="
          echo "ALL XCProj FILES"
          echo "=========================================="

          find noop-source \
            -type f \
            -name "*.xcproj" \
            -print

          echo ""
          echo "=========================================="
          echo "ALL PROJECT JSON FILES"
          echo "=========================================="

          find noop-source \
            -type f \
            \( -name "*.json" -o -name "*.xcproj" \) \
            | grep -Ei "project|strand|xcode" || true
