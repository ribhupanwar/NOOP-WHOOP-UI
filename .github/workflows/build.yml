name: Build NOOP WHOOP iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      # ============================================================
      # XCODE
      # ============================================================

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show Xcode version
        shell: bash
        run: |
          set -e
          xcodebuild -version
          xcode-select -p
          swift --version

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # OFFICIAL PROJECT.YML
      # ============================================================

      - name: Download official NOOP project.yml
        shell: bash
        run: |
          set -e

          curl -L \
            https://raw.githubusercontent.com/ryanbr/noop/main/project.yml \
            -o official-project.yml

          ls -lh official-project.yml

      # ============================================================
      # EXTRACT CUSTOM SOURCE
      # ============================================================

      - name: Extract customized source
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Source ZIP not found."
            exit 1
          fi

          echo "Using source ZIP:"
          echo "$ZIP"

          rm -rf noop-source
          mkdir -p noop-source

          unzip -q "$ZIP" -d noop-source

          echo "Extracted source:"
          find noop-source -maxdepth 3 -type d | head -100

      # ============================================================
      # LOCATE SOURCE
      # ============================================================

      - name: Locate NOOP source
        shell: bash
        run: |
          set -e

          ROOT=$(find noop-source -type d -name "StrandiOS" | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "::error::StrandiOS folder not found."
            exit 1
          fi

          ROOT=$(dirname "$ROOT")

          echo "$ROOT" > source-root.txt

          echo "NOOP source root:"
          echo "$ROOT"

      # ============================================================
      # INSTALL OFFICIAL PROJECT.YML
      # ============================================================

      - name: Install official project.yml
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cp official-project.yml "$ROOT/project.yml"

          ls -lh "$ROOT/project.yml"

      # ============================================================
      # FIX SWIFT PACKAGE IOS VERSION
      # XCODE 16.4 COMPATIBILITY
      # ============================================================

      - name: Fix Package.swift iOS compatibility
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          echo "Fixing Swift Package iOS deployment versions..."

          while IFS= read -r -d '' file; do

            if grep -q '\.iOS(\.v26)' "$file"; then
              sed -i '' 's/\.iOS(\.v26)/.iOS(.v16)/g' "$file"
              echo "Fixed v26: $file"
            fi

            if grep -q '\.iOS(\.v18)' "$file"; then
              sed -i '' 's/\.iOS(\.v18)/.iOS(.v16)/g' "$file"
              echo "Fixed v18: $file"
            fi

          done < <(find Packages -name "Package.swift" -print0)

          echo ""
          echo "Remaining platform declarations:"
          grep -RIn --include="Package.swift" '\.iOS(' Packages 2>/dev/null || true

          echo ""
          echo "Remaining v26:"
          grep -RIn --include="Package.swift" '\.v26' Packages 2>/dev/null || true

          echo ""
          echo "Remaining v18:"
          grep -RIn --include="Package.swift" '\.v18' Packages 2>/dev/null || true

      # ============================================================
      # FIX LIQUID GLASS SOURCE
      # XCODE 16.4 / IOS 18 COMPATIBILITY
      # ============================================================

      - name: Fix Liquid Glass source compatibility
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          FILE="$ROOT/Packages/StrandDesign/Sources/StrandDesign/NoopLiquidGlassSearchField.swift"

          if [ ! -f "$FILE" ]; then
            echo "::error::NoopLiquidGlassSearchField.swift not found."
            exit 1
          fi

          cat > "$FILE" <<'SWIFT'
          import SwiftUI

          public struct NoopLiquidGlassSearchField: View {
              @Binding private var text: String
              private let prompt: String
              private let accessibilityPrompt: String
              private var externalFocus: FocusState<Bool>.Binding?
              @FocusState private var internalFocus: Bool

              public init(
                  text: Binding<String>,
                  prompt: String,
                  accessibilityLabel: String? = nil,
                  isFocused: FocusState<Bool>.Binding? = nil
              ) {
                  self._text = text
                  self.prompt = prompt
                  self.accessibilityPrompt = accessibilityLabel ?? prompt
                  self.externalFocus = isFocused
              }

              public var body: some View {
                  HStack(spacing: NoopMetrics.space2) {
                      Image(systemName: "magnifyingglass")
                          .font(.system(size: 16, weight: .semibold))
                          .foregroundStyle(StrandPalette.textSecondary)
                          .accessibilityHidden(true)

                      TextField(prompt, text: $text)
                          .textFieldStyle(.plain)
                          .font(StrandFont.body)
                          .foregroundStyle(StrandPalette.textPrimary)
                          .focused(focusBinding)
                          .submitLabel(.search)
                          #if os(iOS)
                          .autocorrectionDisabled()
                          .textInputAutocapitalization(.never)
                          #endif

                      if !text.isEmpty {
                          Button {
                              text = ""
                          } label: {
                              Image(systemName: "xmark.circle.fill")
                                  .font(.system(size: 16, weight: .semibold))
                                  .foregroundStyle(StrandPalette.textTertiary)
                                  .frame(width: 28, height: 28)
                                  .contentShape(Circle())
                          }
                          .buttonStyle(.plain)
                          .accessibilityLabel(Text("Clear search"))
                      }
                  }
                  .padding(.horizontal, NoopMetrics.space4)
                  .padding(.vertical, NoopMetrics.space3)
                  .nativeLiquidGlassSearchChrome()
                  .accessibilityElement(children: .contain)
                  .accessibilityLabel(Text(accessibilityPrompt))
              }

              private var focusBinding: FocusState<Bool>.Binding {
                  externalFocus ?? $internalFocus
              }
          }

          public extension View {
              @ViewBuilder
              func nativeLiquidGlassSearchChrome() -> some View {
                  self.background(
                      NoopPanelSurface(
                          cornerRadius: NoopVisualStyle.pillRadius,
                          elevated: false
                      )
                  )
              }

              @ViewBuilder
              func nativeLiquidGlassButtonChrome<Fallback: View>(
                  controlSize: ControlSize = .small,
                  capsule: Bool = false,
                  @ViewBuilder fallback: () -> Fallback
              ) -> some View {
                  fallback()
              }

              @ViewBuilder
              func nativeLiquidGlassCircleFinish() -> some View {
                  self
              }

              @ViewBuilder
              private func noopStandardSearchChrome() -> some View {
                  self.background(
                      NoopPanelSurface(
                          cornerRadius: NoopVisualStyle.pillRadius,
                          elevated: false
                      )
                  )
              }
          }
          SWIFT

          echo "Liquid Glass compatibility file installed."

      # ============================================================
      # INSTALL XCODEGEN
      # ============================================================

      - name: Install XcodeGen
        shell: bash
        run: |
          set -e

          brew install xcodegen

          xcodegen --version

      # ============================================================
      # GENERATE XCODE PROJECT
      # ============================================================

      - name: Generate Xcode project
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          rm -rf Strand.xcodeproj

          xcodegen generate

          if [ ! -f "Strand.xcodeproj/project.pbxproj" ]; then
            echo "::error::project.pbxproj was not generated."
            exit 1
          fi

          echo "Xcode project generated successfully."

      # ============================================================
      # CHECK PROJECT
      # ============================================================

      - name: Check Xcode project
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          xcodebuild -project Strand.xcodeproj -list

      # ============================================================
      # RESOLVE PACKAGES
      # ============================================================

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          xcodebuild \
            -resolvePackageDependencies \
            -project Strand.xcodeproj

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build NOOPiOS
        shell: bash
        run: |
          set -o pipefail

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          rm -rf build

          xcodebuild \
            -project Strand.xcodeproj \
            -scheme NOOPiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build | tee build.log

      # ============================================================
      # LOCATE APP
      # ============================================================

      - name: Locate built iOS app
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          APP=$(find build \
            -type d \
            -path "*/Build/Products/*-iphoneos/*.app" \
            -not -path "*/PlugIns/*" \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "::error::iOS .app not found."
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "Selected app:"
          echo "$APP"

      # ============================================================
      # PREPARE WATCH COMPLICATION
      # FIX SIDeloadly MACH-O -18
      # ============================================================

      - name: Prepare Watch binaries for Sideloadly
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          echo "=========================================="
          echo "Preparing Watch binaries"
          echo "=========================================="

          WATCH_ROOT="$APP/Watch/NOOPWatch.app"

          if [ ! -d "$WATCH_ROOT" ]; then
            echo "No embedded Watch app found."
            exit 0
          fi

          echo "Watch app found:"
          echo "$WATCH_ROOT"

          COMP="$WATCH_ROOT/Plugins/NOOPWatchComplications.appex/NOOPWatchComplications"

          if [ -f "$COMP" ]; then

            echo ""
            echo "=========================================="
            echo "WATCH COMPLICATION"
            echo "=========================================="

            echo "Binary:"
            echo "$COMP"

            echo ""
            echo "Before modification:"
            file "$COMP" || true
            lipo -info "$COMP" || true
            codesign -dvv "$COMP" 2>&1 || true

            echo ""
            echo "Checking architecture..."

            LIPO_INFO=$(lipo -info "$COMP" 2>&1 || true)

            echo "$LIPO_INFO"

            if echo "$LIPO_INFO" | grep -q "Architectures in the fat file"; then

              echo ""
              echo "Fat Mach-O detected."

              TMP="${COMP}.thin"

              if lipo -thin arm64 "$COMP" -output "$TMP"; then
                mv "$TMP" "$COMP"
                echo "Successfully thinned Watch complication to arm64."
              else
                echo "arm64 thinning failed."
                rm -f "$TMP" || true
              fi

            else
              echo "Binary is not a fat Mach-O."
            fi

            echo ""
            echo "Removing existing signature..."

            codesign --remove-signature "$COMP" 2>/dev/null || true

            echo ""
            echo "Applying ad-hoc signature..."

            codesign \
              --force \
              --sign - \
              "$COMP"

            echo ""
            echo "After modification:"

            file "$COMP"
            lipo -info "$COMP" || true

            echo ""
            echo "Signature:"
            codesign -dvv "$COMP" 2>&1 || true

            echo ""
            echo "Watch complication prepared successfully."

          else
            echo "NOOPWatchComplications binary not found."
            echo "Continuing without Watch complication modification."
          fi

      # ============================================================
      # VERIFY EMBEDDED APP STRUCTURE
      # ============================================================

      - name: Verify app bundle before IPA
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          echo "=========================================="
          echo "FINAL APP STRUCTURE"
          echo "=========================================="

          echo "Main app:"
          echo "$APP"

          echo ""
          echo "Embedded applications:"
          find "$APP" \
            -type d \
            -name "*.app" \
            -print

          echo ""
          echo "Embedded extensions:"
          find "$APP" \
            -type d \
            -name "*.appex" \
            -print

          echo ""
          echo "Watch complication:"
          find "$APP" \
            -type f \
            -name "NOOPWatchComplications" \
            -print

      # ============================================================
      # CREATE UNSIGNED IPA
      # ============================================================

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          ROOT=$(cat source-root.txt)

          cd "$ROOT"

          rm -rf Payload

          mkdir -p Payload
          mkdir -p artifacts

          cp -R "$APP" Payload/

          rm -f artifacts/NOOP-WHOOP-Custom-iOS-Unsigned.ipa

          zip -qry \
            artifacts/NOOP-WHOOP-Custom-iOS-Unsigned.ipa \
            Payload

          echo ""
          echo "IPA created:"
          ls -lh artifacts/NOOP-WHOOP-Custom-iOS-Unsigned.ipa

      # ============================================================
      # UPLOAD IPA
      # ============================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-WHOOP-Custom-iOS-Unsigned-IPA
          path: noop-source/**/artifacts/NOOP-WHOOP-Custom-iOS-Unsigned.ipa
          if-no-files-found: error

      # ============================================================
      # UPLOAD GENERATED XCODE PROJECT
      # ============================================================

      - name: Upload generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-Generated-Xcode-Project
          path: noop-source/**/Strand.xcodeproj
          if-no-files-found: error

      # ============================================================
      # UPLOAD BUILD LOGS IF FAILED
      # ============================================================

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-Build-Debug-Logs
          path: |
            noop-source/**/build.log
            noop-source/**/project.yml
            noop-source/**/Packages/**/Package.swift
          if-no-files-found: ignore
