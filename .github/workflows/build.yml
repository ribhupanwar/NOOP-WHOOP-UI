name: Inspect NOOP Xcode Project

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          echo "ZIP:"
          echo "$ZIP"

          rm -rf noop-source
          mkdir -p noop-source

          unzip -q "$ZIP" -d noop-source

      - name: Inspect Xcode files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "XCODE PROJECTS"
          echo "=========================================="

          find noop-source \
            \( -name "*.xcodeproj" -o \
               -name "*.xcworkspace" -o \
               -name "project.pbxproj" -o \
               -name "*.xcconfig" \) \
            -print

          echo ""
          echo "=========================================="
          echo "ALL PBXPROJ FILES"
          echo "=========================================="

          find noop-source \
            -type f \
            -name "project.pbxproj" \
            -print

          echo ""
          echo "=========================================="
          echo "XCODEPROJ CONTENT"
          echo "=========================================="

          find noop-source \
            -type d \
            -name "*.xcodeproj" | while read -r PROJECT; do

            echo ""
            echo "PROJECT: $PROJECT"

            find "$PROJECT" \
              -maxdepth 3 \
              -print

          done

          echo ""
          echo "=========================================="
          echo "WORKSPACE CONTENT"
          echo "=========================================="

          find noop-source \
            -type d \
            -name "*.xcworkspace" | while read -r WORKSPACE; do

            echo ""
            echo "WORKSPACE: $WORKSPACE"

            find "$WORKSPACE" \
              -maxdepth 3 \
              -print

          done

          echo ""
          echo "=========================================="
          echo "GIT FILES"
          echo "=========================================="

          find noop-source/.git \
            -type f 2>/dev/null | head -100 || true
