name: Build NOOP WHOOP IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          set -e

          echo "Searching for pubspec.yaml..."

          PROJECT_ROOT=$(find . -name "pubspec.yaml" \
            -not -path "./.git/*" \
            -print | head -n 1)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: pubspec.yaml not found!"
            echo ""
            echo "Repository structure:"
            find . -maxdepth 4 -type f | head -300
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PROJECT_ROOT")
          PROJECT_ROOT=$(cd "$PROJECT_ROOT" && pwd)

          echo "Flutter project found:"
          echo "$PROJECT_ROOT"

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Clean
        working-directory: ${{ steps.project.outputs.project_root }}
        run: flutter clean

      - name: Flutter Pub Get
        working-directory: ${{ steps.project.outputs.project_root }}
        run: flutter pub get

      - name: Configure iOS signing
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -e

          PBX="ios/Runner.xcodeproj/project.pbxproj"

          if [ -f "$PBX" ]; then
            sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "";/g' "$PBX" || true
            sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBX" || true
            sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "[^"]*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PBX" || true
          fi

          mkdir -p ios/Flutter

          cat > ios/Flutter/Signing.defaults.xcconfig <<'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          DEVELOPMENT_TEAM =
          PROVISIONING_PROFILE_SPECIFIER =
          EOF

      - name: Build iOS
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -e

          flutter build ios \
            --release \
            --no-codesign

      - name: Locate Runner.app
        id: locate
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -e

          APP=$(find build -type d -name "Runner.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: Runner.app not found"
            find build -maxdepth 6 -type d | head -300
            exit 1
          fi

          echo "Runner.app:"
          echo "$APP"

          echo "app_path=$APP" >> "$GITHUB_OUTPUT"

      - name: Check Apple Watch
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          APP="${{ steps.locate.outputs.app_path }}"

          if [ -d "$APP/Watch" ]; then
            echo "WATCH APP FOUND"
            find "$APP/Watch" -maxdepth 4 -type d -name "*.app" -print
          else
            echo "WARNING: No embedded Watch app found."
          fi

      - name: Sign Watch components
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -e

          APP="${{ steps.locate.outputs.app_path }}"

          if [ ! -d "$APP/Watch" ]; then
            echo "No Watch directory."
            exit 0
          fi

          find "$APP/Watch" -type f | while read -r FILE; do
            if file "$FILE" | grep -q "Mach-O"; then
              codesign \
                --force \
                --sign - \
                --timestamp=none \
                "$FILE" || true
            fi
          done

          find "$APP/Watch" -type d -name "*.app" | while read -r WATCHAPP; do
            codesign \
              --force \
              --deep \
              --sign - \
              --timestamp=none \
              "$WATCHAPP" || true
          done

      - name: Sign main iOS app
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -e

          APP="${{ steps.locate.outputs.app_path }}"

          codesign \
            --force \
            --deep \
            --sign - \
            --timestamp=none \
            "$APP" || true

      - name: Create IPA
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -e

          APP="${{ steps.locate.outputs.app_path }}"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/Runner.app

          zip -qry \
            noop-whoop-health-unsigned.ipa \
            Payload

          ls -lh noop-whoop-health-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: noop-whoop-health-unsigned-ipa
          path: ${{ steps.project.outputs.project_root }}/noop-whoop-health-unsigned.ipa
          if-no-files-found: error
